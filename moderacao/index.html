<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qoleto - moderação</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/moderacao/panel.css">
</head>
<body>

<!--
  Painel de moderação dos cadastros (Etapa 3).

  The page is public because its security does not live here: every read, edit
  and verdict goes through admin_producers(), admin_update_producer(),
  admin_bulk() and moderate_producer(), which check public.admins on the server. Someone who opens this URL without being a
  moderator signs in and sees an empty queue and nothing else. The key below is
  the publishable one, the same the app ships with.
-->

<main class="panel">
  <header class="panelTop">
    <a class="brand" href="/">Qoleto</a>
    <span class="panelTitle">Moderação de cadastros</span>
    <span id="who" class="muted"></span>
    <button id="signout" class="ghost" hidden>Sair</button>
  </header>

  <section id="login" class="card login" hidden>
    <h2>Entrar</h2>
    <p class="muted">Acesso restrito aos moderadores do Qoleto.</p>
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="email" placeholder="voce@qoleto.com">
    <label for="password">Senha (opcional)</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="deixe em branco para receber um código">
    <div class="row">
      <button id="enter" class="primary">Entrar</button>
      <button id="magic" class="ghost">Receber código por e-mail</button>
    </div>
    <div id="codeStep" hidden>
      <label for="code">Código recebido por e-mail</label>
      <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="000000">
      <div class="row">
        <button id="confirm" class="primary">Confirmar código</button>
      </div>
    </div>
    <p id="loginMsg" class="muted"></p>
  </section>

  <section id="board" hidden>
    <nav class="tabs">
      <button class="tab on" data-status="pending">Na fila</button>
      <button class="tab" data-status="all">Todos os cadastros</button>
      <button class="tab" data-status="alerts">Alertas</button>
      <button id="reload" class="ghost small">Atualizar</button>
    </nav>

    <div id="tools" class="tools" hidden>
      <input id="q" type="search" placeholder="Buscar por nome, endereço, cidade ou e-mail">
      <select id="fStatus">
        <option value="all">Todas as situações</option>
        <option value="pending">Na fila</option>
        <option value="approved">Aprovados</option>
        <option value="rejected">Recusados</option>
        <option value="paused">Pausados</option>
      </select>
      <select id="fCategory"><option value="">Todas as categorias</option></select>
      <select id="fFlag">
        <option value="">Todos os sinais</option>
        <option value="duplicate">Possíveis duplicados</option>
        <option value="photo">Fotos para conferir</option>
        <option value="prevalidated">Encontrados no Google</option>
        <option value="premium">Premium</option>
      </select>
      <button id="search" class="primary small">Buscar</button>
    </div>

    <div id="bulk" class="bulk" hidden>
      <span id="bulkCount"></span>
      <button class="primary small" data-bulk="approve">Aprovar</button>
      <button class="danger small" data-bulk="reject">Recusar</button>
      <button class="ghost small" data-bulk="pause">Pausar</button>
      <button class="ghost small" data-bulk="unpause">Reativar</button>
      <span id="bulkMsg" class="muted"></span>
    </div>

    <p id="state" class="muted"></p>
    <div id="list" class="list"></div>

    <div id="pager" class="row" hidden>
      <button id="prev" class="ghost small">Anterior</button>
      <button id="next" class="ghost small">Próxima</button>
    </div>
  </section>

  <dialog id="editor" class="editor">
    <div id="editorBody"></div>
    <div class="verdict">
      <button id="editorSave" class="primary">Salvar</button>
      <button id="editorCancel" class="ghost">Cancelar</button>
      <span id="editorMsg" class="muted"></span>
    </div>
  </dialog>
</main>

<script type="module" src="/moderacao/panel.js"></script>
</body>
</html>
