<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<title>Qoleto - plaquinha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* The plaque for the stall or the counter (client review, 25/10): an A5
     sheet, black on white so every phone reads the code, printed from here. */
  :root { --ink: #12241D; --green: #1F4A3A; --line: #D9D2C3; color-scheme: only light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #F4F0E8; color: var(--ink); font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
  .bar { display: flex; gap: 12px; justify-content: center; padding: 16px; }
  .bar button { font: 600 15px 'Plus Jakarta Sans', sans-serif; padding: 12px 22px; border-radius: 12px; border: 0; background: var(--green); color: #fff; cursor: pointer; }
  .sheet { width: 148mm; min-height: 210mm; margin: 0 auto 32px; background: #fff; border: 1px solid var(--line);
           border-radius: 6mm; padding: 14mm 12mm; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6mm; }
  .brand { font: 600 30px 'Fraunces', serif; color: var(--green); letter-spacing: .5px; }
  .call { font: 600 26px/1.15 'Fraunces', serif; margin: 0; }
  .sub { font-size: 15px; line-height: 1.45; margin: 0; color: #3C4A43; max-width: 110mm; }
  #qr svg { width: 92mm; height: 92mm; display: block; }
  .who { font: 600 20px 'Plus Jakarta Sans', sans-serif; margin: 0; }
  .when { font-size: 14px; margin: 0; color: #3C4A43; }
  .url { font-size: 12px; color: #5B665F; word-break: break-all; margin-top: auto; }
  .photo { width: 100%; aspect-ratio: 16 / 9; border-radius: 4mm; background: #DCD8CB center/cover no-repeat; }
  .chip { font: 600 13px 'Plus Jakarta Sans', sans-serif; color: var(--green); background: #E3EFE7; border-radius: 999px; padding: 5px 12px; }
  .sheet.invite { gap: 4mm; padding-top: 10mm; }
  .sheet.invite #qr svg { width: 62mm; height: 62mm; }
  .gone { text-align: center; padding: 40px 16px; font-size: 16px; }
  @media print {
    @page { size: A5; margin: 0; }
    body { background: #fff; }
    .bar { display: none; }
    .sheet { border: 0; border-radius: 0; margin: 0; width: 148mm; height: 210mm; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
</head>
<body>
<div class="bar"><button type="button" onclick="window.print()" id="printBtn">Imprimir</button></div>
<div id="root"></div>
<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  const db = createClient('https://dshqzppwbzdeumwlkpfi.supabase.co', 'sb_publishable_FcuGYckk4FyG9kR9e5iBCQ_NGY_O0Fg');
  const T = {
    pt: { call: 'Avalie a sua visita', subEvent: 'Aponte a câmera do celular para ver o evento no Qoleto. Durante o evento, o mesmo código abre a sua avaliação.', place: 'Local', kinds: { feira: 'Feira', portas_abertas: 'Portas abertas / Venda direta', degustacao: 'Degustação', colheita: 'Colheita', oficina: 'Curso / Oficina', envio_encomenda: 'Envio / Encomenda' }, subPlace: 'Aponte a câmera do celular para o código e conheça a nossa vitrine no Qoleto.', print: 'Imprimir', gone: 'Código não encontrado.' },
    en: { call: 'Review your visit', subEvent: 'Point your phone camera at the code to see the event on Qoleto. During the event, the same code opens your review.', place: 'Location', kinds: { feira: 'Fair', portas_abertas: 'Open doors / Direct sale', degustacao: 'Tasting', colheita: 'Harvest', oficina: 'Course / Workshop', envio_encomenda: 'Shipping / Orders' }, subPlace: 'Point your phone camera at the code and see our showcase on Qoleto.', print: 'Print', gone: 'Code not found.' },
    es: { call: 'Valora tu visita', subEvent: 'Apunta la cámara del teléfono al código para ver el evento en Qoleto. Durante el evento, el mismo código abre tu valoración.', place: 'Lugar', kinds: { feira: 'Feria', portas_abertas: 'Puertas abiertas / Venta directa', degustacao: 'Degustación', colheita: 'Cosecha', oficina: 'Curso / Taller', envio_encomenda: 'Envío / Encargo' }, subPlace: 'Apunta la cámara del teléfono al código y conoce nuestra vitrina en Qoleto.', print: 'Imprimir', gone: 'Código no encontrado.' },
    fr: { call: 'Donnez votre avis', subEvent: "Visez le code avec l'appareil photo pour voir l'événement sur Qoleto. Pendant l'événement, le même code ouvre votre avis.", place: 'Lieu', kinds: { feira: 'Marché', portas_abertas: 'Portes ouvertes / Vente directe', degustacao: 'Dégustation', colheita: 'Récolte', oficina: 'Cours / Atelier', envio_encomenda: 'Envoi / Commande' }, subPlace: "Visez le code avec l'appareil photo et découvrez notre vitrine sur Qoleto.", print: 'Imprimer', gone: 'Code introuvable.' },
    it: { call: 'Recensisci la tua visita', subEvent: "Inquadra il codice con la fotocamera per vedere l'evento su Qoleto. Durante l'evento, lo stesso codice apre la tua recensione.", place: 'Luogo', kinds: { feira: 'Fiera', portas_abertas: 'Porte aperte / Vendita diretta', degustacao: 'Degustazione', colheita: 'Raccolta', oficina: 'Corso / Laboratorio', envio_encomenda: 'Spedizione / Ordini' }, subPlace: 'Inquadra il codice con la fotocamera e scopri la nostra vetrina su Qoleto.', print: 'Stampa', gone: 'Codice non trovato.' },
  };
  const lang = (navigator.language || 'pt').slice(0, 2).toLowerCase();
  const t = T[lang] || T.pt;
  const locale = lang === 'pt' ? 'pt-BR' : lang;
  document.getElementById('printBtn').textContent = t.print;
  const q = new URLSearchParams(location.search);
  const clean = v => (v || '').toLowerCase().replace(/[^0-9a-f]/g, '');
  const ev = clean(q.get('e'));
  const pc = clean(q.get('p'));
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function code(url) {
    const qr = qrcode(0, 'M');
    qr.addData(url);
    qr.make();
    return qr.createSvgTag({ cellSize: 8, margin: 4, scalable: true });
  }

  async function main() {
    const root = document.getElementById('root');
    let url, who = '', when = '', sub, ev0 = null;
    if (ev) {
      const { data: e } = await db.rpc('event_by_token', { p_token: ev });
      if (!e) { root.innerHTML = `<p class="gone">${t.gone}</p>`; return; }
      url = `https://qoleto.com/e/${ev}`;
      who = e.producer_name;
      const d = x => new Date(x).toLocaleString(locale, { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
      when = `${e.title} · ${d(e.starts_at)} - ${d(e.ends_at)}`;
      sub = t.subEvent;
      ev0 = e;
    } else if (pc) {
      const { data: p } = await db.rpc('producer_by_code', { p_code: pc });
      if (!p) { root.innerHTML = `<p class="gone">${t.gone}</p>`; return; }
      url = `https://qoleto.com/p/${pc}`;
      who = p.name;
      sub = t.subPlace;
    } else { root.innerHTML = `<p class="gone">${t.gone}</p>`; return; }
    // an event: the Capa-Convite (27/10)
    if (ev0) {
      const d = x => new Date(x).toLocaleString(locale, { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
      const photo = ev0.banner_url && /^https:\/\//.test(ev0.banner_url)
        ? `<div class="photo" style="background-image:url(&quot;${esc(encodeURI(ev0.banner_url))}&quot;)"></div>` : '';
      const where = ev0.place_address || ev0.city;
      root.innerHTML = `<div class="sheet invite">
        ${photo}
        ${ev0.kind && t.kinds[ev0.kind] ? `<span class="chip">${esc(t.kinds[ev0.kind])}</span>` : ''}
        <p class="call">${esc(ev0.title)}</p>
        <p class="who">${esc(who)}</p>
        <p class="when">${esc(d(ev0.starts_at) + ' - ' + d(ev0.ends_at))}</p>
        ${where ? `<p class="when">${esc(t.place + ': ' + where)}</p>` : ''}
        <div id="qr">${code(url)}</div>
        <p class="sub">${sub}</p>
        <div class="brand">Qoleto</div>
      </div>`;
      return;
    }
    root.innerHTML = `<div class="sheet">
      <div class="brand">Qoleto</div>
      <p class="call">${t.call}</p>
      <p class="sub">${sub}</p>
      <div id="qr">${code(url)}</div>
      <p class="who">${esc(who)}</p>
      ${when ? `<p class="when">${esc(when)}</p>` : ''}
      <div class="url">${esc(url)}</div>
    </div>`;
  }
  main();
</script>
</body>
</html>
